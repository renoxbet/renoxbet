<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Renoxbet Header</title>
    <!-- Google Font: Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: #1a2332;
            /* رجعنا البادينغ باش الهيدر في الأول ياخد بلاصتو وما يغطي والو */
            padding-top: 56px; 
            overflow: auto; 
        }

        /* ----- Custom Header Renoxbet (Normal position, hides when scrolling down) ----- */
        .header-bar {
            position: fixed;
            top: 0; /* في الأول كيكون باين في بلاصتو الطبيعية */
            left: 0;
            background-color: #202d3d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            width: 100%;
            height: 56px;
            border-bottom: 1px solid #2a3a4e;
            z-index: 1000;
            transition: top 0.3s ease-in-out; /* حركة سلسة باش يطلع للفوق ويختفي */
        }

        /* كلاس كيتزاد بالـ JS غير المستخدم كيهبط لتحت، باش الهيدر يهرب لفوق */
        .header-bar.header-hidden {
            top: -60px;
        }

        .left-section, .right-section {
            display: flex;
            align-items: center;
        }

        .left-section { gap: 8px; }
        .right-section { gap: 6px; }

        .renox-logo {
            text-decoration: none;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1;
            white-space: nowrap;
        }
        .renox-logo .part-reno { color: #ffffff; }
        .renox-logo .part-xbet { color: #f5a623; }

        .flag-skew {
            width: 24px;
            height: 16px;
            background-color: #c8102e;
            transform: skewX(-12deg);
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .flag-star {
            width: 9px;
            height: 9px;
            transform: skewX(12deg);
        }

        /* Gift / Bonus Button Design */
        .gift-btn {
            position: relative;
            width: 38px;
            height: 38px;
            background-color: #2b5278;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            flex-shrink: 0;
        }

        .gift-icon {
            width: 22px;
            height: 20px;
            position: relative;
        }

        .gift-lid {
            width: 22px;
            height: 5px;
            background-color: #ffffff;
            border-radius: 2px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .gift-bow {
            position: absolute;
            top: -4px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 4px;
            border: 1.5px solid #ffffff;
            border-bottom: none;
            border-radius: 5px 5px 0 0;
        }

        .gift-box {
            width: 18px;
            height: 14px;
            background-color: #ffffff;
            border-radius: 0 0 2px 2px;
            position: absolute;
            bottom: 0;
            left: 2px;
        }

        .gift-ribbon {
            width: 4px;
            height: 100%;
            background-color: #2b5278;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }

        .gift-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background-color: #8cc63f;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .btn-login {
            background-color: #2b5278;
            color: #ffffff;
            text-decoration: none;
            height: 38px;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .btn-register {
            background-color: #a3cc76;
            color: #ffffff;
            text-decoration: none;
            height: 38px;
            padding: 0 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }

        .content-frame {
            width: 100%;
            height: auto;
            min-height: 100vh;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Main Renoxbet Header -->
    <header class="header-bar" id="mainHeader">
        <div class="left-section">
            <a href="/" class="renox-logo">
                <span class="part-reno">reno</span><span class="part-xbet">xbet</span>
            </a>
            <div class="flag-skew">
                <svg class="flag-star" viewBox="0 0 100 100">
                    <polygon points="50,5 64,36 98,36 70,57 81,91 50,70 19,91 30,57 2,36 36,36" fill="none" stroke="#006233" stroke-width="8"/>
                </svg>
            </div>
        </div>

        <div class="right-section">
            <a href="/bonus" class="gift-btn" aria-label="Bonus">
                <div class="gift-icon">
                    <div class="gift-bow"></div>
                    <div class="gift-lid"></div>
                    <div class="gift-box">
                        <div class="gift-ribbon"></div>
                    </div>
                </div>
                <span class="gift-badge">1</span>
            </a>
            <a href="/login" class="btn-login">Log in</a>
            <a href="/registration" class="btn-register">Registration</a>
        </div>
    </header>

    <!-- Page Content Iframe -->
    <main>
        <iframe src="Registration/index.html" class="content-frame" id="contentFrame"></iframe>
    </main>

    <script>
        const header = document.getElementById('mainHeader');
        const iframe = document.getElementById('contentFrame');
        let lastScrollTop = 0;

        function handleScroll(scrollTop) {
            // إيلا هبط المستخدم لتحت بأكثر من 20 بكسل، خبي الهيدر لفوق
            if (scrollTop > lastScrollTop && scrollTop > 30) {
                header.classList.add('header-hidden');
            } 
            // إيلا طلع لفوق، رجع الهيدر يبان
            else if (scrollTop < lastScrollTop) {
                header.classList.remove('header-hidden');
            }
            lastScrollTop = scrollTop;
        }

        // مراقبة السكرول في الصفحة الرئيسية
        window.addEventListener('scroll', function() {
            handleScroll(window.pageYOffset || document.documentElement.scrollTop);
        });

        // مراقبة السكرول داخل الـ Iframe
        iframe.addEventListener('load', function() {
            try {
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                iframeDoc.addEventListener('scroll', function() {
                    handleScroll(iframeDoc.documentElement.scrollTop || iframeDoc.body.scrollTop);
                });
            } catch (e) {
                console.log("Cross-origin restriction active.");
            }
        });
    </script>

</body>
</html>
